<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,
   initial-scale=1.0">
  <title>Portfolio | Contact</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Shared Header -->
  <header>
    <div class="nav-container">
      <a href="index.html" class="logo">DevPortfolio</a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html">Home</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact

          </a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Contact Section (Flexbox Form) -->
  <main>
    <div class="page-title">
      <h1>Get in Touch</h1>
      <p>Have a question or want to work together? Send a
         message below.</p>
    </div>

    <section class="contact-wrapper">
      <form class="contact-form" action="#" method="POST"
       onsubmit="event.preventDefault(); alert('Message submitted!');">

        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" 
          placeholder="Jane Doe" required>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email"
           placeholder="jane@example.com" required>
        </div>

        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" 
          placeholder="Write your message here..." required>
        </textarea>
        </div>

        <button type="submit" class="submit-btn">Send Message
          
        </button>
      </form>
    </section>
  </main>

  <!-- Shared Footer -->
  <footer>
    <div class="footer-container">
      <p>&copy; 2026 sahad ahamed. All rights reserved.</p>
      <div class="footer-contact">
        <a href="mailto:alex@example.com">sahad@example.com</a>
        <span>•</span>
        <span>+1 (555) 019-2834</span>
      </div>
    </div>
  </footer>

</body>
</html>
